name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host unit tests + bench (no GPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ make

      - name: Configure (CPU-only)
        run: cmake -S . -B build -DCKLAB_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: CTest
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke
        run: |
          ./build/cklab --help
          ./build/cklab --version
          ./build/cklab --mode host --n 64 --reps 2 --op all
